<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Work days</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1B1F22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Work days">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil:wght@700;800;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playwrite+CZ:wght@300;400&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap">
<style>
:root{
  --ink:#1D1B18;
  --ink-soft:#4A4337;
  --rule:rgba(29,27,24,.32);
  --red:#A82614;
  --pen:#23409A;
  --desk:#23282C;
  --tab:#E2CB94;
  --tab-hover:#EBD7A6;
  --sans:"Archivo",system-ui,sans-serif;
  --stencil:"Big Shoulders Stencil","Archivo",sans-serif;
  --hand:"Playwrite CZ","Segoe Script","Bradley Hand",cursive;
  --hs:1;
  --cols:122px minmax(0,1fr) 164px 182px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#1B1F22;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.stencil{font-family:var(--stencil);font-weight:800;line-height:1}

/* ---------- the desk ---------- */
.desk{
  min-height:100vh;
  padding:calc(18px + env(safe-area-inset-top)) 24px 130px;
  overflow-x:hidden;overflow-x:clip;
  display:flex;flex-direction:column;align-items:center;
  background:radial-gradient(ellipse 75% 55% at 50% 0%, #3B444A 0%, #262B2F 55%, #1B1F22 100%);
}
.card-wrap{
  position:relative;width:100%;max-width:1040px;
  filter:drop-shadow(0 30px 34px rgba(0,0,0,.55)) drop-shadow(0 4px 6px rgba(0,0,0,.35));
}

/* ---------- folder tabs ---------- */
.tabs{display:flex;justify-content:center;align-items:center;min-height:0;padding:0 0 10px}
.tab{
  appearance:none;display:inline-grid;place-items:center;
  width:48px;height:48px;padding:0;border:0;border-radius:50%;
  background:transparent;cursor:pointer;
  transition:background-color .15s;
}
.tab:hover{background:rgba(226,203,148,.12)}
.tab:active{background:rgba(226,203,148,.22)}
.tab svg{width:26px;height:26px}
.tab-today{
  width:auto;height:40px;padding:0 16px;border-radius:999px;
  border:1.5px solid rgba(226,203,148,.5);
  color:#E2CB94;font:700 16px/1 var(--sans);font-stretch:80%;
}
.tab-today[hidden]{display:none}
.tabs .spacer{flex:1}

/* ---------- the card ---------- */
.card{
  position:relative;
  padding:34px 44px 26px;
  background-image:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' seed='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42  0 0 0 0 .33  0 0 0 0 .18  0 0 0 .13 0'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>"),
    linear-gradient(180deg, #EFDFB5 0%, #E8D4A3 50%, #E1C990 100%);
  clip-path:polygon(0 0, calc(100% - 48px) 0, 100% 48px, 100% 100%, 0 100%);
}
.card.swap{animation:swap .28s ease-out}
.card.swap-next{animation:swapNext .28s ease-out}
.card.swap-prev{animation:swapPrev .28s ease-out}
@keyframes swap{from{transform:translateY(8px) rotate(-.25deg);opacity:.35}to{transform:none;opacity:1}}
@keyframes swapNext{from{transform:translateX(40px) rotate(.4deg);opacity:.3}to{transform:none;opacity:1}}
@keyframes swapPrev{from{transform:translateX(-40px) rotate(-.4deg);opacity:.3}to{transform:none;opacity:1}}
.card{touch-action:pan-y}

.card-head{
  display:flex;justify-content:space-between;align-items:flex-end;gap:24px;
  padding-bottom:18px;border-bottom:3px solid var(--ink);
}
.card-head h1{margin:0;font-size:20px;line-height:1;font-weight:700;font-stretch:85%}
.r-short{display:none}
.range{overflow-wrap:anywhere;margin:10px 0 0;font-size:36px;line-height:1;font-weight:900;font-stretch:62%;letter-spacing:-.005em}
.card-today{
  appearance:none;align-self:center;margin:0 auto;
  height:42px;padding:0 20px;border-radius:999px;cursor:pointer;
  background:transparent;border:1.5px solid var(--red);color:var(--red);
  font:700 17px/1 var(--sans);font-stretch:80%;
  transition:background-color .15s;
}
.card-today:hover{background:rgba(168,38,20,.08)}
.card-today:active{background:rgba(168,38,20,.16)}
.card-today[hidden]{display:none}
.weekbox{display:flex;align-items:stretch;border:2px solid var(--ink);flex:none}
.wb-label{
  display:flex;flex-direction:column;justify-content:space-between;
  padding:8px 12px;border-right:2px solid var(--ink);
  font-size:13px;font-weight:700;font-stretch:75%;
}
.wb-num{padding:2px 16px 0;font-weight:900;font-size:60px}

.cols{
  display:grid;grid-template-columns:var(--cols);
  padding:10px 0 8px;border-bottom:1.5px solid var(--ink);
  font-size:14px;font-weight:700;font-stretch:75%;
}
.cols span:nth-child(2){padding-left:18px}
.cols span:nth-child(3){padding-left:14px}
.cols span:nth-child(4){padding-left:16px;color:var(--red)}

fieldset{border:0;margin:0;padding:0;min-width:0}
.rows{list-style:none;margin:0;padding:0}
.row{
  display:grid;grid-template-columns:var(--cols);
  min-height:68px;border-bottom:1px solid var(--rule);
}
.row.weekend{background-color:rgba(168,38,20,.05)}
.row > div + div{border-left:1px solid var(--rule)}
.row > .venue-cell{border-left:0}
.row{background-image:linear-gradient(var(--rule),var(--rule));background-size:1px 100%;background-position:122px 0;background-repeat:no-repeat}

.day{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;padding:8px 0 12px 2px;align-self:last baseline}
.dname{font-size:14px;font-weight:700;font-stretch:75%}
.ddate{font-size:28px;letter-spacing:.01em}
.today-ring{position:absolute;left:-12px;top:3px;width:92px;height:62px;pointer-events:none;display:none}
.today-ring path{fill:none;stroke:var(--pen);stroke-width:2.2px;stroke-linecap:round;opacity:.9}
.row.is-today .today-ring{display:block}

.venue-cell{display:flex;align-items:last baseline;padding:0 18px;align-self:last baseline}
.venue{
  width:100%;min-width:0;border:0;background:transparent;border-radius:0;
  padding:6px 0 2px;line-height:1.2 !important;
  font:700 calc(22px * var(--hs))/1.35 var(--hand);color:var(--ink);
}
.venue-cell{position:relative}
.vwrap{position:relative;flex:1 1 auto;min-width:0;display:flex;align-items:last baseline}
.vwrap .venue{position:relative;z-index:1}
.hl{
  position:absolute;left:-5px;top:0;z-index:0;max-width:calc(100% + 10px);
  padding:6px 5px 2px;box-sizing:border-box;overflow:hidden;white-space:pre;pointer-events:none;
  font:700 calc(22px * var(--hs))/1.2 var(--hand);color:transparent;
  background:linear-gradient(100deg, rgba(255,224,60,0) 0, rgba(255,224,60,.78) 5px, rgba(255,216,40,.72) calc(100% - 5px), rgba(255,224,60,0) 100%) 0 78%/100% 58% no-repeat;
}
.hl:empty{display:none}
.suggest{
  position:absolute;left:12px;top:calc(100% - 6px);z-index:25;min-width:220px;max-width:calc(100% - 24px);
  margin:0;padding:6px;list-style:none;
  background:#F3E6C2;border:1.5px solid var(--ink);border-radius:10px;
  box-shadow:0 12px 24px rgba(29,27,24,.28);
}
.suggest[hidden]{display:none}
.suggest li{
  padding:8px 12px;border-radius:7px;cursor:pointer;
  font:700 calc(19px * var(--hs))/1.3 var(--hand);color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.suggest li:hover,.suggest li.active{background:rgba(29,27,24,.1)}
.venue::placeholder{color:rgba(29,27,24,.38);opacity:1}

.days-cell{display:flex;align-items:center;gap:2px;padding:0 8px 0 10px}
.hole{
  appearance:none;display:grid;place-items:center;
  width:44px;height:44px;padding:0;border:0;background:transparent;cursor:pointer;
  border-radius:50%;
}
.ring{
  position:relative;display:block;width:30px;height:30px;border-radius:50%;
  border:1.5px solid rgba(29,27,24,.42);overflow:hidden;
  transition:border-color .15s;
}
.hole:hover .ring{border-color:rgba(29,27,24,.85)}
.punch{position:absolute;display:none;background:var(--desk)}
.ring[data-fill="0.5"] .punch{
  display:block;left:-2px;top:-2px;width:16.5px;height:32px;
  box-shadow:inset 2px 3px 4px rgba(0,0,0,.8);
}
.ring[data-fill="1"]{
  border-color:var(--desk);background:var(--desk);
  box-shadow:inset 0 3px 5px rgba(0,0,0,.85),0 1px 0 rgba(255,250,232,.75);
}
.ring[data-fill="1"] .punch{display:none}
.hole:active .ring{transform:scale(.92)}
.dval{
  margin-left:auto;min-width:42px;text-align:right;font-size:28px;
  border-radius:4px;padding:2px;cursor:ns-resize;user-select:none;
}
.dval.zero{opacity:.28}

.extra-cell{display:flex;flex-direction:column;justify-content:center;padding:0 10px 0 12px}
.xstep{display:flex;align-items:center;gap:4px}
.xbtn{
  appearance:none;flex:none;display:grid;place-items:center;
  width:40px;height:40px;padding:0;cursor:pointer;
  background:transparent;border:1.5px solid rgba(168,38,20,.5);border-radius:7px;
  transition:background-color .15s,border-color .15s,opacity .15s;
}
.xbtn svg{width:14px;height:14px}
.xbtn:hover{background:rgba(168,38,20,.08);border-color:var(--red)}
.xbtn:active{background:rgba(168,38,20,.16)}
.xbtn:disabled{opacity:.3;cursor:default;background:transparent;border-color:rgba(168,38,20,.5)}
.extra{display:flex;align-items:baseline;gap:3px;color:var(--red);cursor:text}
.extra .unit{font-weight:700;font-size:16px}
.xh{
  width:36px;border:0;border-bottom:1.5px dotted var(--red);border-radius:0;background:transparent;
  padding:4px 2px 2px;text-align:right;
  font-family:var(--stencil);font-weight:800;font-size:28px;color:var(--red);
}
.xh::placeholder{color:rgba(168,38,20,.4);opacity:1}
.xh[aria-invalid="true"]{border-bottom-style:dashed;border-bottom-width:2px}
.xhint{display:none;margin-top:3px;font-size:12px;font-weight:600;color:var(--red)}
.extra-cell.bad .xhint{display:block}

.totals{
  display:grid;grid-template-columns:var(--cols);align-items:baseline;
  padding:16px 0 14px;border-top:2px solid var(--ink);margin-top:-1px;
}
.t-label{grid-column:1 / 3;font-size:24px;font-weight:800;font-stretch:70%}
.t-days{padding-left:14px;font-weight:900;font-size:38px}
.t-extra{padding-left:16px;color:var(--red);font-weight:900;font-size:38px}
.totals small{margin-left:6px;font-family:var(--sans);font-weight:700;font-size:16px;font-stretch:80%}
.t-extra small{margin-left:4px}

.fine{
  display:flex;justify-content:space-between;gap:24px;
  padding-top:10px;border-top:1px solid var(--rule);
  font-size:14px;font-weight:600;font-stretch:85%;color:var(--ink-soft);
}
.fine span:last-child{padding-right:110px}

/* ---------- month stamp ---------- */
.stamp{
  position:absolute;right:-22px;bottom:-96px;width:136px;height:136px;
  transform:rotate(-13deg);mix-blend-mode:multiply;opacity:.9;pointer-events:none;
}
.stamp .ring-o{fill:none;stroke:var(--red);stroke-width:6px}
.stamp .ring-i{fill:none;stroke:var(--red);stroke-width:2px}
.stamp text{fill:var(--red);font-family:var(--sans)}
.stamp .s-ring{font-stretch:75%;font-weight:800;font-size:16px;letter-spacing:1.5px}
.stamp .s-num{font-family:var(--stencil);font-weight:900;font-size:58px}
.stamp .s-word{font-stretch:80%;font-weight:800;font-size:15px}
.stamp .s-extra{font-stretch:80%;font-weight:700;font-size:13px}

/* ---------- save status, on the desk ---------- */
.status{
  width:100%;max-width:1040px;margin:34px 0 0;
  display:flex;align-items:center;gap:9px;
  font-size:15px;font-weight:600;font-stretch:85%;color:#E3D3AE;
}
.status::before{content:"";width:9px;height:9px;border-radius:50%;flex:none;background:#9C8C68}
.status[data-tone="ok"]::before{background:#7DB36B}
.status[data-tone="busy"]::before{background:#E2CB94;animation:pulse 1s ease-in-out infinite}
.status[data-tone="warn"]{color:#F0A08F}
.status[data-tone="warn"]::before{background:#E0533B}
@keyframes pulse{50%{opacity:.3}}
.status:not([data-tone="warn"]){position:absolute;width:1px;height:1px;margin:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}


/* ---------- handwriting picker ---------- */
.more-btn{
  appearance:none;display:grid;place-items:center;
  width:44px;height:44px;padding:0;cursor:pointer;
  border-radius:50%;border:1.5px solid rgba(226,203,148,.32);background:transparent;
  transition:background-color .15s,border-color .15s;
}

.more-btn svg{width:22px;height:22px;fill:#E2CB94}
.more-btn:hover{border-color:rgba(226,203,148,.7);background:rgba(226,203,148,.08)}
.more-btn[aria-expanded="true"]{background:#E8D4A3;border-color:#E8D4A3}
.more-btn[aria-expanded="true"] svg{fill:#1D1B18}
.more-btn:focus-visible{outline:2px solid #F0E2BC;outline-offset:3px;border-radius:50%}
.hand-pick[hidden]{display:none}
.export{clear:both;margin-top:16px;padding-top:14px;border-top:1px solid rgba(226,203,148,.2)}
.export-title{margin:0 0 10px;color:#E3D3AE;font:600 15px/1 var(--sans);font-stretch:85%}
.export-row{display:flex;flex-wrap:wrap;gap:8px}
#exportMonth{
  flex:1 1 160px;min-height:44px;padding:0 12px;border-radius:10px;
  background:#1B1F22;color:#EADBB8;border:1.5px solid rgba(226,203,148,.32);
  font:600 16px var(--sans);
}
.export-btn{
  min-height:44px;padding:0 18px;border-radius:10px;cursor:pointer;
  background:#E8D4A3;color:#1D1B18;border:0;font:700 16px var(--sans);font-stretch:85%;
}
.export-btn:hover{background:#F1E2BA}
.export-btn:disabled{opacity:.6;cursor:progress}
.export-msg{margin:8px 0 0;min-height:0;color:#E3D3AE;font:500 14px/1.35 var(--sans)}
.export-msg:empty{display:none}
.export-msg.warn{color:#F0A08F}
.topbar{width:100%;max-width:1040px;display:flex;justify-content:flex-end;margin-bottom:14px}
.menu{position:relative;z-index:30}
.hand-pick{
  position:absolute;right:0;top:calc(100% + 8px);width:min(440px, calc(100vw - 24px));
  margin:0;padding:14px 14px 16px;min-width:0;
  background:#262B2F;border:1.5px solid rgba(226,203,148,.28);border-radius:16px;
  box-shadow:0 18px 40px rgba(0,0,0,.5);
}
.hand-pick legend{float:left;width:100%;padding:0;margin-bottom:12px;color:#E3D3AE;font:600 15px/1 var(--sans);font-stretch:85%}
.chips{clear:both;display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.chip span{
  display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;
  background:rgba(226,203,148,.1);color:#EADBB8;border:1.5px solid rgba(226,203,148,.32);
  cursor:pointer;line-height:1;white-space:nowrap;transition:background-color .15s,border-color .15s;
}
.chip span:hover{border-color:rgba(226,203,148,.7)}
.chip input:checked + span{background:#E8D4A3;color:#1D1B18;border-color:#E8D4A3}
.chip input:focus-visible + span{outline:2px solid #F0E2BC;outline-offset:2px}

/* ---------- focus ---------- */
:focus{outline:none}
:focus-visible{outline:2px solid var(--pen);outline-offset:3px;border-radius:4px}
.tab:focus-visible{outline-color:#F0E2BC;outline-offset:2px;border-radius:999px}
.venue:focus-visible,.xh:focus-visible{outline-offset:2px}

@media (prefers-reduced-motion:reduce){
  .card.swap,.card.swap-next,.card.swap-prev{animation:none}
  .status[data-tone="busy"]::before{animation:none}
}


/* ---------- one shared line per row (computer layout) ---------- */
@media (min-width:721px){
  .row{
    align-items:center;
    background-image:linear-gradient(var(--rule),var(--rule)),linear-gradient(var(--rule),var(--rule)),linear-gradient(var(--rule),var(--rule));
    background-size:1px 100%,1px 100%,1px 100%;
    background-position:122px 0,calc(100% - 346px) 0,calc(100% - 182px) 0;
  }
  .row > div + div{border-left:0}
  .row > .day,.row > .venue-cell{align-self:center}
  .day{flex-direction:row;align-items:baseline;justify-content:flex-start;gap:9px;padding:0 0 0 2px}
  .dname{font-size:15px;min-width:30px}
  .ddate,.dval{line-height:1}
  .venue-cell{align-items:center}
  .vwrap{align-items:center;transform:translateY(var(--vshift, 0px))}
  .venue{padding:6px 0 !important}
  .hl{padding:6px 5px !important}
  .xh{line-height:1;padding:3.5px 2px 2px}
  .today-ring{top:50%;left:30px;transform:translateY(-50%);width:84px;height:54px}
}
/* ---------- phone ---------- */
@media (max-width:720px){
  .desk{padding:calc(10px + env(safe-area-inset-top)) 12px 48px}
  .topbar{margin-bottom:8px}
  .tabs{padding-bottom:6px}
  .tab-today{height:38px;font-size:15px}
  .card{padding:22px 20px 18px;clip-path:polygon(0 0, calc(100% - 34px) 0, 100% 34px, 100% 100%, 0 100%)}
  .card-head{gap:12px;padding-bottom:14px;flex-wrap:wrap}
  .card-today{order:3;flex-basis:100%;margin:2px 0 0;height:40px;font-size:16px}
  .card-head > div:first-child{min-width:0;flex:1 1 0}
  .card-head h1{font-size:16px}
  .range{margin-top:6px;font-size:22px;line-height:1.05}
  .wb-label{padding:5px 8px;font-size:11px}
  .wb-num{padding:2px 10px 0;font-size:44px}
  .cols{display:none}
  .row{
    grid-template-columns:44px minmax(0,1fr) auto;
    grid-template-areas:"day venue venue" "days days extra";
    column-gap:9px;min-height:0;padding:10px 0 8px;
    border-bottom:3px solid var(--ink);
  }
  .row > div + div{border-left:0}
  .row{background-image:none}
  .day{grid-area:day;padding:0 0 3px 2px;gap:1px;align-self:last baseline}
  .dname{font-size:12px}
  .ddate{font-size:17px;letter-spacing:0}
  .today-ring{left:-8px;top:-3px;width:58px;height:42px}
  .suggest{left:0;max-width:100%}
  .venue-cell{grid-area:venue;align-self:last baseline;padding:0 0 1px;border-bottom:1px dashed rgba(29,27,24,.28)}
  .venue{font-size:calc(19px * var(--hs));padding:4px 0 0}
  .hl{font-size:calc(19px * var(--hs));padding:4px 5px 0}
  .days-cell{grid-area:days;padding:2px 0 0;gap:0}
  .ring{width:28px;height:28px}
  .ring[data-fill="0.5"] .punch{width:15.5px;height:30px}
  .dval{margin-left:4px;min-width:34px;text-align:left;font-size:24px}
  .extra-cell{grid-area:extra;padding:2px 0 0;align-items:flex-end}
  .xstep{gap:3px}
  .xbtn{width:38px;height:38px}
  .extra{gap:2px}
  .extra .unit{font-size:15px}
  .xh{width:32px;font-size:25px;padding-top:6px}
  .totals{display:flex;gap:14px;padding:14px 0 12px}
  .t-label{font-size:21px}
  .t-days{margin-left:auto;padding-left:0;font-size:32px}
  .t-extra{padding-left:0;font-size:32px}
  .totals small{font-size:14px;margin-left:5px}
  .t-extra small{margin-left:3px}
  .fine{flex-direction:column;gap:4px;padding-right:76px;font-size:13px;line-height:1.3}
  .fine span:last-child{padding-right:0}
  .stamp{width:104px;height:104px;right:-4px;bottom:-78px}
  .status{margin-top:96px;font-size:14px}


}
@media (max-width:360px){

  .row{grid-template-columns:40px minmax(0,1fr) auto}
  .ddate{font-size:16px}
  .hole{width:38px;height:44px}
  .ring{width:26px;height:26px}
  .ring[data-fill="0.5"] .punch{width:14.5px;height:28px}
  .dval{min-width:28px;font-size:22px}
  .xbtn{width:36px;height:36px}
  .xh{width:30px;font-size:23px}
}
</style>

<body>
<main class="desk">
  <div class="topbar">
    <div class="menu">
  <button type="button" class="more-btn" id="moreBtn" aria-expanded="false" aria-controls="handPick" aria-label="Menu" title="Menu">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/></svg>
  </button>
  <fieldset class="hand-pick" id="handPick" hidden>
    <legend>Handwriting for venues</legend>
    <div class="chips" id="handChips"></div>
    <div class="export">
      <p class="export-title">Export a month</p>
      <div class="export-row">
        <label class="sr-only" for="exportMonth">Month to export</label>
        <select id="exportMonth"></select>
        <button type="button" class="export-btn" id="exportBtn">Download PDF</button>
      </div>
      <p class="export-msg" id="exportMsg" role="status"></p>
    </div>
  </fieldset>
    </div>
  </div>
  <div class="card-wrap">

    <section class="card" id="card" aria-labelledby="cardTitle">
      <header class="card-head">
        <div>
          <h1 id="cardTitle">Week</h1>
          <p class="range"><span class="r-long" id="rangeLong"></span><span class="r-short" id="rangeShort"></span></p>
        </div>
        <button type="button" class="card-today" id="todayBtn" hidden>Back to this week</button>
        <div class="weekbox" aria-label="Week number">
          <div class="wb-label" aria-hidden="true"><span>Week</span><span>No.</span></div>
          <div class="wb-num stencil" id="weekNo"></div>
        </div>
      </header>

      <div class="cols" aria-hidden="true">
        <span>Day</span><span>Venue</span><span>Days worked</span><span>Extra hours</span>
      </div>

      <fieldset id="rowsField">
        <legend class="sr-only">Days of the week</legend>
        <ol class="rows" id="rows"></ol>
      </fieldset>

      <div class="totals">
        <span class="t-label">Week total</span>
        <span class="t-days stencil" id="totDays"></span>
        <span class="t-extra stencil" id="totExtra"></span>
      </div>

      <footer class="fine">
        <span>Punch a hole once for half a day, again for a full day.</span>
        <span>Extra hours are entered in red.</span>
      </footer>
    </section>

    <svg class="stamp" id="stamp" viewBox="0 0 210 210" role="img" aria-label="Month total">
      <filter id="ink"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="9" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.4"/></filter>
      <g filter="url(#ink)">
        <circle class="ring-o" cx="105" cy="105" r="96"/>
        <circle class="ring-i" cx="105" cy="105" r="70"/>
        <path id="stampRing" d="M105 23a82 82 0 1 1-.01 0" fill="none"/>
        <text class="s-ring"><textPath href="#stampRing" textLength="505" lengthAdjust="spacing" id="stampText"></textPath></text>
        <text class="s-num" x="105" y="118" text-anchor="middle" id="stampNum">0</text>
        <text class="s-word" x="105" y="142" text-anchor="middle" id="stampWord">days</text>
        <text class="s-extra" x="105" y="160" text-anchor="middle" id="stampExtra">+0 h extra</text>
      </g>
    </svg>
  </div>

  <p class="status" id="status" role="status" data-tone="busy">Opening your log…</p>

</main>

<script>
"use strict";
(function () {
  var DAY_LONG = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
  var DAY_SHORT = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var MAX_DAYS = 2, STEP = 0.5, MAX_HOURS = 3, MAX_VENUE = 80;
  var LS_KEY = "workdays.v1";
  var FIELDS = ["v","d","x"];

  function $(id){ return document.getElementById(id); }
  var reduceMotion = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  /* ---------- dates (local time) ---------- */
  function atMidnight(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function addDays(d, n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function mondayOf(d){ var x = atMidnight(d); return addDays(x, -((x.getDay() + 6) % 7)); }
  function pad(n){ return (n < 10 ? "0" : "") + n; }
  function keyOf(m){ return "w-" + m.getFullYear() + "-" + pad(m.getMonth() + 1) + "-" + pad(m.getDate()); }
  function parseKey(k){
    var m = /^w-(\d{4})-(\d{2})-(\d{2})$/.exec(k);
    if (!m) return null;
    var d = new Date(+m[1], +m[2] - 1, +m[3]);
    return d.getDay() === 1 ? d : null;
  }
  function dm(d){ return d.getDate() + "." + (d.getMonth() + 1) + "."; }
  function isoWeek(d){
    var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    var dayNum = t.getUTCDay() || 7;
    t.setUTCDate(t.getUTCDate() + 4 - dayNum);
    var yearStart = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    return Math.ceil(((t - yearStart) / 86400000 + 1) / 7);
  }
  function rangeLabel(mon, sun, short){
    function mn(d){ var m = MONTHS[d.getMonth()]; return short ? m.slice(0, 3) : m; }
    if (mon.getFullYear() !== sun.getFullYear())
      return mon.getDate() + " " + mn(mon) + " " + mon.getFullYear() + " – " + sun.getDate() + " " + mn(sun) + " " + sun.getFullYear();
    if (mon.getMonth() !== sun.getMonth())
      return mon.getDate() + " " + mn(mon) + " – " + sun.getDate() + " " + mn(sun) + " " + sun.getFullYear();
    return mon.getDate() + "–" + sun.getDate() + " " + mn(sun) + " " + sun.getFullYear();
  }

  /* ---------- numbers ---------- */
  function clampDays(n){ n = Number(n); return isFinite(n) ? Math.min(MAX_DAYS, Math.max(0, Math.round(n / STEP) * STEP)) : 0; }
  function clampHours(n){ n = Number(n); return isFinite(n) ? Math.min(MAX_HOURS, Math.max(0, Math.round(n))) : 0; }
  function fmtNum(n){ return String(Math.round(n * 100) / 100); }
  function fmtHours(x){ return x ? String(x) : ""; }
  function parseHours(s){
    s = String(s).trim();
    if (s === "") return 0;
    if (!/^\d$/.test(s)) return null;
    var n = +s;
    return n > MAX_HOURS ? null : n;
  }
  function daysWord(n){ return n === 1 ? "day" : "days"; }

  /* ---------- data ---------- */
  function emptyWeek(){ var a = []; for (var i = 0; i < 7; i++) a.push({ v: "", d: 0, x: 0 }); return { days: a }; }
  var EMPTY = emptyWeek();
  function clean(raw){
    var out = emptyWeek();
    var arr = raw && Array.isArray(raw.days) ? raw.days : [];
    for (var i = 0; i < 7; i++){
      var r = arr[i] && typeof arr[i] === "object" ? arr[i] : {};
      out.days[i].v = typeof r.v === "string" ? r.v.slice(0, MAX_VENUE) : "";
      out.days[i].d = clampDays(r.d);
      out.days[i].x = clampHours(r.x);
    }
    return out;
  }
  function isEmptyWeek(w){ return w.days.every(function (x){ return !x.v.trim() && !x.d && !x.x; }); }

  var weeks = {};
  var monday = mondayOf(new Date());
  var mode = "connecting";        // connecting | account | local | memory | readonly
  var ready = false;
  var col = null;
  var dirty = new Map();
  var ver = 0;
  var timers = {};
  var chains = {};
  var inflight = 0;
  var problem = null;
  var unreachable = false;

  function getWeek(k, create){
    if (weeks[k]) return weeks[k];
    if (!create) return null;
    weeks[k] = emptyWeek();
    return weeks[k];
  }
  function currentWeek(){ return getWeek(keyOf(monday), false) || EMPTY; }

  function applyIncoming(k, raw){
    var inc = clean(raw);
    var w = getWeek(k, true);
    for (var i = 0; i < 7; i++){
      for (var f = 0; f < 3; f++){
        var fld = FIELDS[f];
        if (!dirty.has(k + "|" + i + "|" + fld)) w.days[i][fld] = inc.days[i][fld];
      }
    }
  }
  function dirtyKeys(){
    var s = new Set();
    dirty.forEach(function (_v, key){ s.add(key.split("|")[0]); });
    return Array.from(s);
  }

  /* ---------- rows ---------- */
  var rowsEl = $("rows");
  var rows = [];
  var NS = "http://www.w3.org/2000/svg";

  function el(tag, cls, attrs){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (attrs) for (var a in attrs) e.setAttribute(a, attrs[a]);
    return e;
  }

  function buildRows(){
    for (var i = 0; i < 7; i++) (function (i){
      var li = el("li", "row");

      var day = el("div", "day");
      var name = el("span", "dname");
      var date = el("span", "ddate stencil");
      var ring = document.createElementNS(NS, "svg");
      ring.setAttribute("class", "today-ring");
      ring.setAttribute("viewBox", "0 0 92 62");
      ring.setAttribute("aria-hidden", "true");
      var rp = document.createElementNS(NS, "path");
      rp.setAttribute("d", "M18 46c-12-8-10-26 10-33 20-7 50-4 56 12 6 16-16 28-40 29-14 1-28-3-33-10");
      ring.appendChild(rp);
      day.appendChild(name); day.appendChild(date); day.appendChild(ring);

      var vcell = el("div", "venue-cell");
      var venue = el("input", "venue", { type: "text", maxlength: String(MAX_VENUE), autocomplete: "off", spellcheck: "false" });
      var vwrap = el("div", "vwrap");
      var hl = el("span", "hl", { "aria-hidden": "true" });
      vwrap.appendChild(hl); vwrap.appendChild(venue);
      vcell.appendChild(vwrap);

      var dcell = el("div", "days-cell");
      var holes = [];
      for (var h = 0; h < MAX_DAYS; h++){
        var btn = el("button", "hole", { type: "button", tabindex: "-1" });
        var rg = el("span", "ring", { "data-fill": "0" });
        rg.appendChild(el("span", "punch"));
        btn.appendChild(rg);
        dcell.appendChild(btn);
        holes.push({ btn: btn, ring: rg });
      }
      var val = el("span", "dval stencil", { role: "spinbutton", tabindex: "0", "aria-valuemin": "0", "aria-valuemax": String(MAX_DAYS) });
      dcell.appendChild(val);

      var xcell = el("div", "extra-cell");
      var xstep = el("div", "xstep");
      var xminus = el("button", "xbtn", { type: "button", tabindex: "-1" });
      xminus.innerHTML = '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 7h9" fill="none" stroke="#A82614" stroke-width="2.4" stroke-linecap="round"/></svg>';
      var extra = el("label", "extra");
      var xh = el("input", "xh", { type: "text", inputmode: "numeric", placeholder: "0", maxlength: "1", autocomplete: "off" });
      var unit = el("span", "unit", { "aria-hidden": "true" }); unit.textContent = "h";
      extra.appendChild(xh); extra.appendChild(unit);
      var xplus = el("button", "xbtn", { type: "button", tabindex: "-1" });
      xplus.innerHTML = '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 7h9M7 2.5v9" fill="none" stroke="#A82614" stroke-width="2.4" stroke-linecap="round"/></svg>';
      xstep.appendChild(xminus); xstep.appendChild(extra); xstep.appendChild(xplus);
      var hint = el("span", "xhint"); hint.textContent = "Type 0, 1, 2 or 3";
      xcell.appendChild(xstep); xcell.appendChild(hint);

      li.appendChild(day); li.appendChild(vcell); li.appendChild(dcell); li.appendChild(xcell);
      rowsEl.appendChild(li);

      var r = { li: li, name: name, date: date, venue: venue, hl: hl, holes: holes, val: val, xh: xh, xcell: xcell, xminus: xminus, xplus: xplus };
      rows.push(r);

      venue.addEventListener("input", function (){
        hl.textContent = venue.value.trim() ? venue.value : "";
        if (mode === "readonly") return;
        var w = getWeek(keyOf(monday), true);
        var had = w.days[i].v.trim() !== "";
        setField(i, "v", venue.value.slice(0, MAX_VENUE));
        if (!had && venue.value.trim() && w.days[i].d === 0){ setField(i, "d", 1); paintDays(r, 1); }
        if (document.activeElement === venue) showSuggest(r);
      });
      venue.setAttribute("enterkeyhint", i < 6 ? "next" : "done");
      venue.setAttribute("role", "combobox");
      venue.setAttribute("aria-autocomplete", "list");
      venue.setAttribute("aria-controls", "venueSuggest");
      venue.setAttribute("aria-expanded", "false");
      venue.addEventListener("focus", function (){ showSuggest(r); });
      venue.addEventListener("click", function (){ if (sugEl.hidden) showSuggest(r); });
      venue.addEventListener("blur", function (){ setTimeout(function (){ if (sugFor === r && document.activeElement !== venue) hideSuggest(); }, 0); });
      venue.addEventListener("keydown", function (e){
        if (e.key === "ArrowDown"){ if (moveSuggest(1)) e.preventDefault(); }
        else if (e.key === "ArrowUp"){ if (moveSuggest(-1)) e.preventDefault(); }
        else if (e.key === "Enter"){
          if (e.isComposing) return;
          e.preventDefault();
          if (!sugEl.hidden && sugActive >= 0) pickSuggest(sugActive);
          else venue.dispatchEvent(new Event("change"));
          hideSuggest();
          if (i < 6) rows[i + 1].venue.focus();
          else venue.blur();
        }
        else if (e.key === "Escape"){ if (!sugEl.hidden){ e.preventDefault(); hideSuggest(); } }
      });
      venue.addEventListener("change", function (){
        var t = venue.value.trim();
        if (t !== venue.value){ venue.value = t; setField(i, "v", t); }
        updateVenueList();
      });

      function setDays(next){
        if (mode === "readonly") return;
        next = clampDays(next);
        if (next === currentWeek().days[i].d) return;
        setField(i, "d", next);
        paintDays(r, next);
      }
      holes.forEach(function (hole, h){
        hole.btn.addEventListener("click", function (){
          var d = currentWeek().days[i].d;
          setDays(d <= h ? h + 0.5 : (d === h + 0.5 ? h + 1 : h));
        });
      });
      val.addEventListener("keydown", function (e){
        var k = e.key, d = currentWeek().days[i].d;
        if (k === "ArrowUp" || k === "ArrowRight" || k === "PageUp" || k === "+") setDays(d + STEP);
        else if (k === "ArrowDown" || k === "ArrowLeft" || k === "PageDown" || k === "-") setDays(d - STEP);
        else if (k === "Home") setDays(0);
        else if (k === "End") setDays(MAX_DAYS);
        else return;
        e.preventDefault();
        e.stopPropagation();
      });
      val.addEventListener("wheel", function (e){
        if (document.activeElement !== val) return;
        e.preventDefault();
        setDays(currentWeek().days[i].d + (e.deltaY < 0 ? STEP : -STEP));
      }, { passive: false });

      function stepHours(dir){
        if (mode === "readonly") return;
        var x = currentWeek().days[i].x;
        var next = clampHours(x + dir);
        xh.removeAttribute("aria-invalid");
        xcell.classList.remove("bad");
        xh.value = fmtHours(next);
        if (next !== x) setField(i, "x", next);
        paintHours(r, next);
      }
      xminus.addEventListener("click", function (){ stepHours(-1); });
      xplus.addEventListener("click", function (){ stepHours(1); });
      xh.addEventListener("keydown", function (e){
        if (e.key === "ArrowUp"){ e.preventDefault(); stepHours(1); }
        else if (e.key === "ArrowDown"){ e.preventDefault(); stepHours(-1); }
      });

      xh.addEventListener("input", function (){
        if (mode === "readonly") return;
        var p = parseHours(xh.value);
        if (p === null){ xh.setAttribute("aria-invalid", "true"); xcell.classList.add("bad"); return; }
        xh.removeAttribute("aria-invalid");
        xcell.classList.remove("bad");
        setField(i, "x", p);
        paintHours(r, p);
      });
      xh.addEventListener("blur", function (){
        xh.value = fmtHours(currentWeek().days[i].x);
        xh.removeAttribute("aria-invalid");
        xcell.classList.remove("bad");
      });
    })(i);
  }

  function paintDays(r, d){
    r.val.textContent = fmtNum(d);
    r.val.classList.toggle("zero", d === 0);
    r.val.setAttribute("aria-valuenow", String(d));
    r.val.setAttribute("aria-valuetext", fmtNum(d) + " " + daysWord(d));
    r.holes.forEach(function (hole, h){
      var fill = Math.max(0, Math.min(1, d - h));
      hole.ring.setAttribute("data-fill", String(fill));
      var next = d <= h ? h + 0.5 : (d === h + 0.5 ? h + 1 : h);
      hole.btn.setAttribute("aria-label", r.long + ": set " + fmtNum(next) + " " + daysWord(next));
    });
  }

  function paintHours(r, x){
    r.xminus.disabled = x <= 0;
    r.xplus.disabled = x >= MAX_HOURS;
  }


  /* ---------- handwriting ---------- */
  var HANDS = [
    { id: "cz",    name: "Czech school", fam: '"Playwrite CZ"',  hs: 1 },
    { id: "quick", name: "Quick note",   fam: '"Caveat"',        hs: 1.32 },
    { id: "neat",  name: "Neat print",   fam: '"Patrick Hand"',  hs: 1.14 },
    { id: "note",  name: "Notebook",     fam: '"Kalam"',         hs: 1.04 },
    { id: "round", name: "Rounded",      fam: '"Shantell Sans"', hs: 0.98 },
    { id: "type",  name: "Typewriter",   fam: '"Courier Prime"', hs: 1.02 }
  ];
  var HAND_KEY = "workdays.hand";
  var handId = "cz";
  var handTouched = false;
  var handChain = Promise.resolve();
  function handById(id){ for (var i = 0; i < HANDS.length; i++) if (HANDS[i].id === id) return HANDS[i]; return null; }
  function applyHand(id){
    var h = handById(id);
    if (!h) return;
    handId = id;
    var root = document.documentElement.style;
    root.setProperty("--hand", h.fam + ', "Segoe Script", "Bradley Hand", cursive');
    root.setProperty("--hs", String(h.hs));
    if (typeof alignVenues === "function") setTimeout(alignVenues, 0);
    var input = document.getElementById("hand-" + id);
    if (input) input.checked = true;
  }
  function setMore(open){
    if (open){ fillExportMonths(); exportMsg(""); }
    $("handPick").hidden = !open;
    $("moreBtn").setAttribute("aria-expanded", open ? "true" : "false");
  }
  function buildHandPicker(){
    $("moreBtn").addEventListener("click", function (){ setMore($("handPick").hidden); });
    document.addEventListener("click", function (e){
      if ($("handPick").hidden) return;
      if (!e.target.closest || !e.target.closest(".menu")) setMore(false);
    });
    document.addEventListener("keydown", function (e){
      if (e.key === "Escape" && !$("handPick").hidden){ setMore(false); $("moreBtn").focus(); }
    });
    var box = $("handChips");
    HANDS.forEach(function (h){
      var lab = el("label", "chip");
      var inp = el("input", null, { type: "radio", name: "hand", id: "hand-" + h.id, value: h.id });
      var sp = el("span");
      sp.textContent = h.name;
      sp.style.fontFamily = h.fam + ', "Segoe Script", cursive';
      sp.style.fontSize = Math.round(17 * h.hs) + "px";
      lab.appendChild(inp); lab.appendChild(sp);
      box.appendChild(lab);
      inp.addEventListener("change", function (){
        if (!inp.checked) return;
        handTouched = true;
        applyHand(h.id);
        try { window.localStorage.setItem(HAND_KEY, h.id); } catch (e){}
        saveHand();
      });
    });
    var saved = null;
    try { saved = window.localStorage.getItem(HAND_KEY); } catch (e){}
    applyHand(handById(saved) ? saved : "cz");
  }
  function saveHand(){
    if (mode !== "account" || !ready || !col) return;
    var id = handId;
    handChain = handChain.then(function (){
      return col.doc("settings").set({ hand: id });
    }).catch(function (){});
  }
  function onRemoteSettings(data){
    if (!data || handTouched) return;
    if (typeof data.hand === "string" && handById(data.hand) && data.hand !== handId){
      applyHand(data.hand);
      try { window.localStorage.setItem(HAND_KEY, data.hand); } catch (e){}
    }
  }


  /* ---------- export a month as PDF ---------- */
  function fillExportMonths(){
    var sel = $("exportMonth");
    var base = addDays(monday, 3);
    var y = base.getFullYear(), m = base.getMonth();
    var keep = sel.value;
    sel.innerHTML = "";
    for (var n = 0; n < 12; n++){
      var d = new Date(y, m - n, 1);
      var o = document.createElement("option");
      o.value = d.getFullYear() + "-" + d.getMonth();
      o.textContent = MONTHS[d.getMonth()] + " " + d.getFullYear();
      sel.appendChild(o);
    }
    sel.value = keep && sel.querySelector('option[value="' + keep + '"]') ? keep : sel.options[0].value;
  }

  function monthRows(y, m){
    var out = [], n = new Date(y, m + 1, 0).getDate();
    for (var d = 1; d <= n; d++){
      var date = new Date(y, m, d);
      var i = (date.getDay() + 6) % 7;
      var w = weeks[keyOf(mondayOf(date))];
      var day = w ? w.days[i] : { v: "", d: 0, x: 0 };
      out.push({ date: date, i: i, v: day.v.trim(), d: day.d, x: day.x });
    }
    return out;
  }

  function loadFonts(fams){
    if (!document.fonts || !document.fonts.load) return Promise.resolve();
    var all = Promise.all(fams.map(function (f){ return document.fonts.load(f).catch(function (){}); }));
    return Promise.race([all, new Promise(function (r){ setTimeout(r, 3000); })]);
  }

  function fitText(ctx, text, max){
    if (ctx.measureText(text).width <= max) return text;
    while (text.length > 1 && ctx.measureText(text + "…").width > max) text = text.slice(0, -1);
    return text + "…";
  }

  function drawMonth(y, m){
    var S = 4 / 3, W = 1240, H = 1754;
    var cv = document.createElement("canvas");
    cv.width = Math.round(W * S); cv.height = Math.round(H * S);
    var c = cv.getContext("2d");
    c.scale(S, S);
    var INK = "#1D1B18", RED = "#A82614", DESK = "#23282C", SOFT = "#4A4337", RULE = "rgba(29,27,24,.32)";
    var SANS = '"Archivo", "Arial Narrow", Arial, sans-serif';

  function buildPdf(jpeg, iw, ih){

    function obj(n, body){ offs[n] = len; add(n + " 0 obj\n" + body + "\nendobj\n"); }
    var PW = 595.28, PH = 841.89;
    add("%PDF-1.4\n%âãÏÓ\n");
    obj(1, "<< /Type /Catalog /Pages 2 0 R >>");
    obj(2, "<< /Type /Pages /Kids [3 0 R] /Count 1 >>");
    obj(3, "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + PW + " " + PH + "] /Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>");
    var content = "q " + PW + " 0 0 " + PH + " 0 0 cm /Im0 Do Q";
    obj(4, "<< /Length " + content.length + " >>\nstream\n" + content + "\nendstream");
    offs[5] = len;
    add("5 0 obj\n<< /Type /XObject /Subtype /Image /Width " + iw + " /Height " + ih + " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + jpeg.length + " >>\nstream\n");

    for (var n = 1; n <= 5; n++) x += String(offs[n]).padStart(10, "0") + " 00000 n \n";
    add(x + "trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n" + xref + "\n%%EOF\n");
    return new Blob(parts, { type: "application/pdf" });

  /* ---------- line the venue text up with the date numbers ---------- */

  /* ---------- venue suggestions: the two most recent venues ---------- */
  var recentVenues = [];

  /* ---------- status ---------- */
  function setStatus(){
    var s = $("status"), text, tone;
    var busy = Object.keys(timers).length > 0 || inflight > 0;
    if (problem){ text = problem; tone = "warn"; }
    else if (mode === "connecting"){ text = "Opening your log…"; tone = "busy"; }
    else if (mode === "readonly"){ text = "You can view this log but not change it"; tone = "warn"; }
    else if (mode === "memory"){ text = "Not saved: this view can't keep data, so entries clear when you close it"; tone = "warn"; }
    else if (mode === "local"){ text = busy ? "Saving…" : "Saved in this browser only"; tone = busy ? "busy" : "ok"; }
    else if (!ready){
      if (unreachable){ text = "Can't reach your saved log yet. New entries will save once it connects"; tone = "warn"; }
      else { text = "Opening your log…"; tone = "busy"; }
    }
    else { text = busy ? "Saving…" : "Saved to your account"; tone = busy ? "busy" : "ok"; }
    if (s.textContent !== text) s.textContent = text;
    s.setAttribute("data-tone", tone);

  /* ---------- editing + saving ---------- */
  function setField(i, f, val){
    var k = keyOf(monday);
    var w = getWeek(k, true);
    if (w.days[i][f] === val) return;
    w.days[i][f] = val;
    dirty.set(k + "|" + i + "|" + f, ++ver);
    problem = null;
    paintTotals();
    paintStamp();
    scheduleSave(k);
  }

  function scheduleSave(k){
    if (mode === "readonly") return;
    if (timers[k]) clearTimeout(timers[k]);
    timers[k] = setTimeout(function (){ delete timers[k]; save(k); setStatus(); }, mode === "account" ? 700 : 250);
    setStatus();
  }

  function clearDirtyFor(k, snap){
    dirty.forEach(function (v, key){
      if (key.indexOf(k + "|") !== 0) return;
      if (!snap || snap.get(key) === v) dirty.delete(key);
    });
  }

  function save(k){
    if (mode === "local" || mode === "memory"){ persistLocal(); clearDirtyFor(k, null); return; }
    if (mode !== "account" || !ready || !col || !weeks[k]) return;
    var snap = new Map();
    dirty.forEach(function (v, key){ if (key.indexOf(k + "|") === 0) snap.set(key, v); });
    var body = {
      days: weeks[k].days.map(function (d){ return { v: d.v.trim(), d: d.d, x: d.x }; }),
      updated: new Date().toISOString()
    };
    inflight++;
    setStatus();
    chains[k] = (chains[k] || Promise.resolve()).then(function (){
      return writeDoc(k, body, 1);
    }).then(function (){
      clearDirtyFor(k, snap);
      inflight--;
      setStatus();
    }, function (e){
      inflight--;
      onWriteError(e);
      setStatus();
    });

  function writeDoc(k, body, retries){
    return col.doc(k).set(body).catch(function (e){

          .then(function (){ return writeDoc(k, body, retries - 1); });

  function onWriteError(e){
    var code = e && e.code;
    if (code === "invalid_argument"){ setReadonly(); return; }
    if (code === "quota_exceeded"){ problem = "Your log is full, so new entries aren't being saved"; return; }
    if (code === "revoked" || code === "not_granted" || code === "capability_disabled" || code === "capability_removed"){
      switchToLocal(); return;
    }
    problem = "Couldn't save your last change. Edit the entry again to retry";
  }

  function setReadonly(){
    mode = "readonly";
    $("rowsField").disabled = true;
    rows.forEach(function (r){ r.val.setAttribute("aria-readonly", "true"); });
    refreshValues();
  }

  /* ---------- storage: browser fallback ---------- */
  function lsRead(){
    try { var raw = window.localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : null; }
    catch (e){ return undefined; }
  }
  function persistLocal(){
    var out = {};
    Object.keys(weeks).forEach(function (k){ if (parseKey(k) && !isEmptyWeek(weeks[k])) out[k] = weeks[k]; });
    try { window.localStorage.setItem(LS_KEY, JSON.stringify(out)); if (mode === "memory") mode = "local"; }
    catch (e){ mode = "memory"; }
  }
  function startLocal(){
    col = null;
    var data = lsRead();
    mode = data === undefined ? "memory" : "local";
    if (data && typeof data === "object"){
      Object.keys(data).forEach(function (k){ if (parseKey(k)) applyIncoming(k, data[k]); });
    }
    if (dirty.size) persistLocal();
    dirty.clear();
    refreshValues();
    updateVenueList();
    setStatus();
  }
  function switchToLocal(){
    col = null;
    if (unsub){ try { unsub(); } catch (e){} unsub = null; }
    mode = "local";
    persistLocal();
    dirty.clear();
    problem = mode === "local" ? "Saving to your account stopped. Entries are kept in this browser" : null;
  }

  /* ---------- storage: your account ---------- */
  var unsub = null;
  function waitForClaude(ms){
    return new Promise(function (res){
      var t0 = Date.now();
      (function poll(){
        var c = window.claude;
        if (c && typeof c.use === "function") return res(c);
        if (Date.now() - t0 > ms) return res(null);
        setTimeout(poll, 100);
      })();
    });
  }

  function connect(){
    waitForClaude(2000).then(function (c){
      if (!c) return startLocal();
      return Promise.all([
        c.use("db").catch(function (){ return null; }),
        c.use("user").catch(function (){ return null; })
      ]).then(function (res){
        var db = res[0], user = res[1];
        if (!db || !user) return startLocal();
        return Promise.resolve(user.id()).catch(function (){ return null; }).then(function (uid){
          if (!uid) return startLocal();
          try { col = db.collection("data/users/" + uid); }
          catch (e){ return startLocal(); }
          mode = "account";
          subscribe();
          setStatus();
        });
      });
    }).catch(function (){ startLocal(); });
  }

  function subscribe(){
    var timer = setTimeout(function (){ if (!ready){ unreachable = true; setStatus(); } }, 10000);
    unsub = col.onSnapshot(function (snap){
      snap.docChanges().forEach(function (ch){
        var id = ch.doc.id;
        if (id === "settings"){ if (ch.type !== "removed") onRemoteSettings(ch.doc.data()); return; }
        if (!parseKey(id)) return;
        applyIncoming(id, ch.type === "removed" ? null : ch.doc.data());
      });
      if (!snap.metadata.fromCache && !ready){
        ready = true;
        unreachable = false;
        clearTimeout(timer);
        dirtyKeys().forEach(function (k){ save(k); });
        if (handTouched) saveHand();
      }
      refreshValues();
      updateVenueList();
      setStatus();
    }, function (e){
      clearTimeout(timer);
      var code = e && e.code;
      if (code === "invalid_argument" || code === "resource_exhausted"){
        problem = "Couldn't load your saved log. Reload the page to try again";
        setStatus();
        return;
      }
      switchToLocal();
      refreshValues();
      setStatus();
    });
  }

  /* ---------- navigation ---------- */
  function go(deltaWeeks){
    monday = addDays(monday, 7 * deltaWeeks);
    renderWeek(deltaWeeks > 0 ? 1 : -1);
  }

  /* swipe left / right on the card to change week */
  var sx = null, sy = 0, st = 0;
  var cardEl = $("card");
  cardEl.addEventListener("touchstart", function (e){
    if (e.touches.length !== 1){ sx = null; return; }
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now();
  }, { passive: true });
  cardEl.addEventListener("touchend", function (e){
    if (sx === null) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - sx, dy = t.clientY - sy;
    sx = null;
    if (Date.now() - st > 800) return;
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    if (document.activeElement && document.activeElement.tagName === "INPUT") document.activeElement.blur();
    go(dx < 0 ? 1 : -1);
  }, { passive: true });
  cardEl.addEventListener("touchcancel", function (){ sx = null; }, { passive: true });

  /* drag the card sideways with a mouse */
  var mx = null, my = 0;
  cardEl.addEventListener("pointerdown", function (e){
    if (e.pointerType !== "mouse" || e.button !== 0) return;
    if (e.target.closest("input, button, select, label, .suggest")) return;
    mx = e.clientX; my = e.clientY;
  });
  window.addEventListener("pointerup", function (e){
    if (mx === null) return;
    var dx = e.clientX - mx, dy = e.clientY - my;
    mx = null;
    if (Math.abs(dx) < 80 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    go(dx < 0 ? 1 : -1);
  });

  /* two-finger sideways swipe on a trackpad */
  var wx = 0, wLock = 0;
  window.addEventListener("wheel", function (e){
    if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
    var now = Date.now();
    if (now < wLock) return;
    wx += e.deltaX;
    if (Math.abs(wx) > 120){ go(wx > 0 ? 1 : -1); wx = 0; wLock = now + 700; }
    clearTimeout(wheelReset); wheelReset = setTimeout(function (){ wx = 0; }, 200);
  }, { passive: true });
  var wheelReset = 0;
  $("todayBtn").addEventListener("click", function (){
    monday = mondayOf(new Date());
    renderWeek(true);
  });
  document.addEventListener("keydown", function (e){
    var t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.getAttribute("role") === "spinbutton")) return;
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === "ArrowLeft"){ go(-1); e.preventDefault(); }
    else if (e.key === "ArrowRight"){ go(1); e.preventDefault(); }
  });

  /* ---------- installable app: work offline when opened from its own website ---------- */
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && window.top === window.self){
    window.addEventListener("load", function (){
      navigator.serviceWorker.register("sw.js").catch(function (){});
    });
  }

  /* ---------- start ---------- */
  buildRows();
  buildHandPicker();
  alignVenues();
  $("exportBtn").addEventListener("click", exportMonth);
  renderWeek(false);
  setInterval(tick, 30000);
  setStatus();
  connect();
})();
</script>
</body>
</html>
